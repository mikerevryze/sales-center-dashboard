<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revryze OS</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --card: #1a1d2e;
      --border: #2a2d3e;
      --accent: #00d68f;
      --text: #ffffff;
      --muted: #94a3b8;
      --sidebar: #0d1017;
      --red: #ef4444;
      --yellow: #eab308;
      --green: #00d68f;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .badge { padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-green { background: rgba(0,214,143,0.15); color: var(--green); }
    .badge-yellow { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }
    .btn { padding: 8px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    input, select, textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 14px; outline: none; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: var(--card); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px 12px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .progress-bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
    .callout { background: rgba(0,214,143,0.08); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 14px 16px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; cursor: pointer; color: var(--muted); transition: all 0.15s; font-size: 14px; }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .nav-item.active { background: rgba(0,214,143,0.1); color: var(--accent); }
    .tab { padding: 8px 20px; border-bottom: 2px solid transparent; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 500; transition: all 0.15s; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    audio { width: 100%; margin: 8px 0; }
    audio::-webkit-media-controls-panel { background: var(--card); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend } = Recharts;

/* ─── API helper ─── */
const API = (path, opts) => fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts }).then(r => r.json());

/* ─── Format helpers ─── */
const fmt = {
  usd: v => '$' + Number(v||0).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0}),
  usd2: v => '$' + Number(v||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}),
  pct: v => (Number(v||0)*100).toFixed(1) + '%',
  pctInt: v => Math.round(Number(v||0)*100) + '%',
  num: v => Number(v||0).toLocaleString(),
  mmss: s => { const m=Math.floor(s/60), ss=s%60; return m+':'+(ss<10?'0':'')+ss; },
  date: d => { if(!d) return '—'; const dt=new Date(d); return (dt.getMonth()+1)+'/'+dt.getDate()+'/'+dt.getFullYear(); },
};

const scoreColor = s => s >= 75 ? 'green' : s >= 50 ? 'yellow' : 'red';
const healthColor = (val, threshold, higher=true) => {
  if (!threshold) return 'green';
  const ratio = val / threshold;
  if (higher) return ratio >= 1 ? 'green' : ratio >= 0.7 ? 'yellow' : 'red';
  return ratio <= 1 ? 'green' : ratio <= 1.3 ? 'yellow' : 'red';
};

/* ─── Icons (inline SVG) ─── */
const Icons = {
  scorecard: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>,
  analytics: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
  callCenter: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>,
  pipeline: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
  addClient: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4-4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>,
  logout: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
  chevron: <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>,
  lightbulb: <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 18h6M10 22h4M12 2a7 7 0 014 12.7V17H8v-2.3A7 7 0 0112 2z"/></svg>,
  search: <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
};

/* ═══════════════════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════════════════ */
function Sidebar({ clients, selectedClient, selectedLocation, onSelectClient, onSelectLocation, activePage, onNavigate, onLogout }) {
  const [expandedClient, setExpandedClient] = useState(null);

  const handleClientClick = (client) => {
    if (!client.multi_location || client.locations.length <= 1) {
      onSelectClient(client);
      onSelectLocation(client.locations[0] || null);
      setExpandedClient(null);
    } else {
      setExpandedClient(expandedClient === client.client_id ? null : client.client_id);
    }
  };

  return (
    <div style={{ width: 240, minWidth: 240, height: '100vh', background: 'var(--sidebar)', borderRight: '1px solid var(--border)', display: 'flex', flexDirection: 'column', position: 'fixed', left: 0, top: 0, zIndex: 50 }}>
      {/* Logo */}
      <div style={{ padding: '20px 16px', borderBottom: '1px solid var(--border)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: 'linear-gradient(135deg, var(--accent), #00b377)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 16, color: '#000' }}>R</div>
          <span style={{ fontWeight: 700, fontSize: 18 }}>Revryze OS</span>
        </div>
      </div>

      {/* Client Selector */}
      <div style={{ padding: '12px 12px 0' }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8, padding: '0 4px' }}>Clients</div>
        <div style={{ maxHeight: 180, overflowY: 'auto' }}>
          {clients.map(c => (
            <div key={c.client_id}>
              <div
                onClick={() => handleClientClick(c)}
                style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 10px', borderRadius: 6, cursor: 'pointer', fontSize: 13, background: selectedClient?.client_id === c.client_id ? 'rgba(0,214,143,0.1)' : 'transparent', color: selectedClient?.client_id === c.client_id ? 'var(--accent)' : 'var(--muted)' }}
              >
                <span>{c.client_name}</span>
                {c.multi_location && c.locations.length > 1 && (
                  <span style={{ transform: expandedClient === c.client_id ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}>{Icons.chevron}</span>
                )}
              </div>
              {expandedClient === c.client_id && c.locations.map(loc => (
                <div
                  key={loc.location_id}
                  onClick={() => { onSelectClient(c); onSelectLocation(loc); setExpandedClient(null); }}
                  style={{ padding: '6px 10px 6px 28px', fontSize: 12, cursor: 'pointer', borderRadius: 4, color: selectedLocation?.location_id === loc.location_id ? 'var(--accent)' : 'var(--muted)', background: selectedLocation?.location_id === loc.location_id ? 'rgba(0,214,143,0.06)' : 'transparent' }}
                >
                  {loc.location_name}
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>

      {/* Nav */}
      <nav style={{ flex: 1, padding: '16px 12px', display: 'flex', flexDirection: 'column', gap: 2 }}>
        <div style={{ fontSize: 11, fontWeight: 600, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em', marginBottom: 8, padding: '0 4px' }}>Navigation</div>
        {[
          { id: 'scorecard', icon: Icons.scorecard, label: 'Scorecard' },
          { id: 'analytics', icon: Icons.analytics, label: 'Analytics' },
          { id: 'callcenter', icon: Icons.callCenter, label: 'Call Center' },
          { id: 'pipeline', icon: Icons.pipeline, label: 'Pipeline' },
          { id: 'addclient', icon: Icons.addClient, label: 'Add Client' },
        ].map(item => (
          <div key={item.id} className={'nav-item' + (activePage === item.id ? ' active' : '')} onClick={() => onNavigate(item.id)}>
            {item.icon}
            <span>{item.label}</span>
          </div>
        ))}
      </nav>

      {/* User + Logout */}
      <div style={{ padding: '12px', borderTop: '1px solid var(--border)' }}>
        <div className="nav-item" onClick={onLogout}>
          {Icons.logout}
          <span>Log Out</span>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   SCORECARD MODULE
   ═══════════════════════════════════════════════ */
function ScorecardModule({ clientId, locationId }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!clientId) return;
    setLoading(true);
    const params = new URLSearchParams({ client_id: clientId });
    if (locationId) params.set('location_id', locationId);
    API('/scorecard?' + params).then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
  }, [clientId, locationId]);

  if (loading) return <div style={{ padding: 40, color: 'var(--muted)' }}>Loading scorecard...</div>;
  if (!data || !data.locations?.length) return <div style={{ padding: 40, color: 'var(--muted)' }}>No scorecard data available.</div>;

  const MetricTile = ({ label, value, threshold, format, higherIsBetter = true, suffix = '' }) => {
    const formatted = format === 'usd' ? fmt.usd(value) : format === 'pct' ? fmt.pctInt(value) : format === 'days' ? (value != null ? value + ' days' : '—') : fmt.num(value);
    const color = threshold ? healthColor(value, threshold, higherIsBetter) : 'green';
    const pct = threshold ? Math.min((value / threshold) * 100, 100) : 100;
    const colors = { green: 'var(--green)', yellow: 'var(--yellow)', red: 'var(--red)' };
    return (
      <div className="card" style={{ minWidth: 200 }}>
        <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 6, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.03em' }}>{label}</div>
        <div style={{ fontSize: 28, fontWeight: 700, marginBottom: 4 }}>{formatted}{suffix}</div>
        {threshold != null && <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 8 }}>Target: {format === 'usd' ? fmt.usd(threshold) : fmt.num(threshold)}</div>}
        <div className="progress-bar">
          <div className="progress-fill" style={{ width: pct + '%', background: colors[color] }} />
        </div>
      </div>
    );
  };

  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 24 }}>Scorecard</h1>
      {data.locations.map(loc => (
        <div key={loc.location_id} style={{ marginBottom: 32 }}>
          {data.locations.length > 1 && <h2 style={{ fontSize: 18, fontWeight: 600, marginBottom: 16, color: 'var(--accent)' }}>{loc.location_name}</h2>}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 16 }}>
            <MetricTile label="Active Members" value={loc.metrics.members.value} threshold={loc.metrics.members.threshold} format="num" />
            <MetricTile label="MRR" value={loc.metrics.mrr.value} threshold={loc.metrics.mrr.threshold} format="usd" />
            <MetricTile label="Cost Per Lead" value={loc.metrics.cpl.value} format="usd" higherIsBetter={false} />
            <MetricTile label="Close Rate" value={loc.metrics.close_rate.value} format="pct" />
            <MetricTile label="Days to Opening" value={loc.metrics.days_to_opening.value} format="days" />
            <MetricTile label="Ad Spend (MTD)" value={loc.metrics.ad_spend.value} format="usd" />
          </div>
        </div>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   ANALYTICS MODULE
   ═══════════════════════════════════════════════ */
function AnalyticsModule({ clientId, locationId, locations }) {
  const [activeLocId, setActiveLocId] = useState(locationId);
  const [startDate, setStartDate] = useState(() => { const d = new Date(); d.setMonth(d.getMonth() - 3); return d.toISOString().slice(0,10); });
  const [endDate, setEndDate] = useState(() => new Date().toISOString().slice(0,10));
  const [selectedCampaigns, setSelectedCampaigns] = useState([]);
  const [summary, setSummary] = useState(null);
  const [daily, setDaily] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showAttrition, setShowAttrition] = useState(false);
  const [showSettings, setShowSettings] = useState(false);

  useEffect(() => { setActiveLocId(locationId); }, [locationId]);

  useEffect(() => {
    if (!clientId || !activeLocId) return;
    setLoading(true);
    const base = { client_id: clientId, location_id: activeLocId, start_date: startDate, end_date: endDate };
    if (selectedCampaigns.length) base.campaigns = selectedCampaigns.join(',');
    const qs = new URLSearchParams(base);
    Promise.all([
      API('/analytics/summary?' + qs),
      API('/analytics/daily?' + qs),
    ]).then(([s, d]) => { setSummary(s); setDaily(d.daily || []); setLoading(false); }).catch(() => setLoading(false));
  }, [clientId, activeLocId, startDate, endDate, selectedCampaigns]);

  const toggleCampaign = (name) => {
    setSelectedCampaigns(prev => prev.includes(name) ? prev.filter(c => c !== name) : [...prev, name]);
  };

  const KPICard = ({ label, value, sub }) => (
    <div className="card" style={{ textAlign: 'center' }}>
      <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4, fontWeight: 600, textTransform: 'uppercase' }}>{label}</div>
      <div style={{ fontSize: 26, fontWeight: 700 }}>{value}</div>
      {sub && <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 4 }}>{sub}</div>}
    </div>
  );

  const ltv = summary?.ltv || {};
  const ltvValue = showAttrition ? ltv.adjusted_ltv : ltv.base_ltv;

  const chartTooltipStyle = { backgroundColor: 'var(--card)', border: '1px solid var(--border)', borderRadius: 8, color: 'var(--text)', fontSize: 12 };

  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 20 }}>Analytics</h1>

      {/* Location tabs */}
      {locations && locations.length > 1 && (
        <div style={{ display: 'flex', gap: 0, marginBottom: 20, borderBottom: '1px solid var(--border)' }}>
          {locations.map(loc => (
            <div key={loc.location_id} className={'tab' + (activeLocId === loc.location_id ? ' active' : '')} onClick={() => setActiveLocId(loc.location_id)}>
              {loc.location_name}
            </div>
          ))}
        </div>
      )}

      {/* Date range + settings */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20, flexWrap: 'wrap' }}>
        <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={{ width: 160 }} />
        <span style={{ color: 'var(--muted)' }}>to</span>
        <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} style={{ width: 160 }} />
        <button className="btn btn-outline" onClick={() => setShowSettings(!showSettings)}>
          {showSettings ? 'Hide' : 'Show'} Filters
        </button>
      </div>

      {/* Campaign filters */}
      {showSettings && summary?.campaigns && (
        <div className="card" style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 10 }}>Campaign Filters</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10 }}>
            {summary.campaigns.map(c => (
              <label key={c.name} style={{ display: 'flex', alignItems: 'center', gap: 6, cursor: 'pointer', fontSize: 13, color: 'var(--muted)' }}>
                <input type="checkbox" checked={selectedCampaigns.includes(c.name)} onChange={() => toggleCampaign(c.name)} style={{ width: 16, height: 16, accentColor: 'var(--accent)' }} />
                {c.name}
              </label>
            ))}
          </div>
        </div>
      )}

      {loading ? <div style={{ padding: 40, color: 'var(--muted)' }}>Loading analytics...</div> : summary && (
        <>
          {/* KPI Cards */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(160px, 1fr))', gap: 14, marginBottom: 24 }}>
            <KPICard label="Total Spend" value={fmt.usd(summary.kpis.total_spend)} />
            <KPICard label="Leads" value={fmt.num(summary.kpis.total_leads)} />
            <KPICard label="CPL" value={fmt.usd2(summary.kpis.cpl)} />
            <KPICard label="Appointments" value={fmt.num(summary.kpis.total_appointments)} />
            <KPICard label="Enrollments" value={fmt.num(summary.kpis.total_enrollments)} />
            <KPICard label="Close Rate" value={fmt.pctInt(summary.kpis.close_rate)} />
            <KPICard label="Cost / Enrollment" value={fmt.usd2(summary.kpis.cost_per_enrollment)} />
          </div>

          {/* LTV Callout */}
          <div className="callout" style={{ marginBottom: 24, display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 4 }}>Lifetime Value (LTV)</div>
              <div style={{ fontSize: 32, fontWeight: 700, color: 'var(--accent)' }}>{fmt.usd(ltvValue)}</div>
              <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 4 }}>
                {fmt.usd2(ltv.avg_monthly_value)}/mo × {ltv.avg_lifespan_months?.toFixed(1)} months
                {showAttrition && <span> (attrition-adjusted: {fmt.pctInt(ltv.attrition_rate)} churn)</span>}
              </div>
            </div>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 13 }}>
              <span style={{ color: 'var(--muted)' }}>Attrition Model</span>
              <div onClick={() => setShowAttrition(!showAttrition)} style={{ width: 40, height: 22, borderRadius: 11, background: showAttrition ? 'var(--accent)' : 'var(--border)', cursor: 'pointer', position: 'relative', transition: 'background 0.2s' }}>
                <div style={{ width: 16, height: 16, borderRadius: '50%', background: '#fff', position: 'absolute', top: 3, left: showAttrition ? 21 : 3, transition: 'left 0.2s' }} />
              </div>
            </label>
          </div>

          {/* Charts */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 24 }}>
            <div className="card">
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Daily Ad Spend</div>
              <ResponsiveContainer width="100%" height={260}>
                <LineChart data={daily.filter(d => d.projected_enrollments == null)}>
                  <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
                  <XAxis dataKey="date" tick={{ fill: 'var(--muted)', fontSize: 11 }} tickFormatter={v => v.slice(5)} />
                  <YAxis tick={{ fill: 'var(--muted)', fontSize: 11 }} tickFormatter={v => '$'+v} />
                  <Tooltip contentStyle={chartTooltipStyle} />
                  <Line type="monotone" dataKey="spend" stroke="var(--accent)" strokeWidth={2} dot={false} />
                </LineChart>
              </ResponsiveContainer>
            </div>
            <div className="card">
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Cumulative Memberships</div>
              <ResponsiveContainer width="100%" height={260}>
                <LineChart data={daily}>
                  <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" />
                  <XAxis dataKey="date" tick={{ fill: 'var(--muted)', fontSize: 11 }} tickFormatter={v => v.slice(5)} />
                  <YAxis tick={{ fill: 'var(--muted)', fontSize: 11 }} />
                  <Tooltip contentStyle={chartTooltipStyle} />
                  <Line type="monotone" dataKey="cumulative_enrollments" stroke="var(--accent)" strokeWidth={2} dot={false} name="Actual" />
                  <Line type="monotone" dataKey="projected_enrollments" stroke="var(--yellow)" strokeWidth={2} strokeDasharray="6 3" dot={false} name="Projected" />
                  <Legend />
                </LineChart>
              </ResponsiveContainer>
            </div>
          </div>

          {/* Sales Velocity */}
          <div className="card" style={{ marginBottom: 24 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 14 }}>Sales Velocity</div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 }}>
              <div>
                <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4 }}>Avg Days to Close</div>
                <div style={{ fontSize: 24, fontWeight: 700 }}>{summary.sales_velocity.avg_days_to_close.toFixed(1)}</div>
              </div>
              <div>
                <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4 }}>Enrollments / Week</div>
                <div style={{ fontSize: 24, fontWeight: 700 }}>{summary.sales_velocity.enrollments_per_week.toFixed(1)}</div>
              </div>
              <div>
                <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4 }}>Pipeline Value</div>
                <div style={{ fontSize: 24, fontWeight: 700 }}>{fmt.usd(summary.sales_velocity.pipeline_value)}</div>
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   CALL CENTER MODULE
   ═══════════════════════════════════════════════ */
function CallCenterModule({ clientId, locationId }) {
  const [calls, setCalls] = useState([]);
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(1);
  const [filters, setFilters] = useState({ start_date: '', end_date: '', closer: '', outcome: '', search: '' });
  const [selectedCall, setSelectedCall] = useState(null);
  const [callDetail, setCallDetail] = useState(null);
  const [audioUrl, setAudioUrl] = useState('');
  const [activeTab, setActiveTab] = useState('calls');
  const [leaderboard, setLeaderboard] = useState([]);
  const [overrideScore, setOverrideScore] = useState('');
  const [overrideNotes, setOverrideNotes] = useState('');
  const [showOverride, setShowOverride] = useState(false);
  const [sortCol, setSortCol] = useState('avg_score');
  const [sortDir, setSortDir] = useState('desc');
  const [loading, setLoading] = useState(true);

  const fetchCalls = useCallback(() => {
    if (!clientId || !locationId) return;
    setLoading(true);
    const params = new URLSearchParams({ client_id: clientId, location_id: locationId, page: String(page), page_size: '50' });
    Object.entries(filters).forEach(([k, v]) => { if (v) params.set(k, v); });
    API('/calls?' + params).then(d => { setCalls(d.calls || []); setTotal(d.total || 0); setLoading(false); }).catch(() => setLoading(false));
  }, [clientId, locationId, page, filters]);

  useEffect(() => { fetchCalls(); }, [fetchCalls]);

  useEffect(() => {
    if (!clientId || !locationId) return;
    const params = new URLSearchParams({ client_id: clientId, location_id: locationId });
    API('/calls/leaderboard?' + params).then(d => setLeaderboard(d.reps || [])).catch(() => {});
  }, [clientId, locationId]);

  const selectCall = (call) => {
    setSelectedCall(call);
    setCallDetail(null);
    setAudioUrl('');
    setShowOverride(false);
    API('/calls/' + call.call_id).then(d => {
      setCallDetail(d);
      if (d.manager_override) {
        setOverrideScore(d.manager_override.score || '');
        setOverrideNotes(d.manager_override.notes || '');
      } else {
        setOverrideScore('');
        setOverrideNotes('');
      }
    });
    API('/calls/' + call.call_id + '/audio').then(d => { if (d.url) setAudioUrl(d.url); }).catch(() => {});
  };

  const saveOverride = () => {
    API('/calls/' + selectedCall.call_id + '/override', {
      method: 'POST',
      body: JSON.stringify({ score: overrideScore ? parseInt(overrideScore) : null, notes: overrideNotes || null }),
    }).then(() => { alert('Override saved'); });
  };

  const sortedLeaderboard = useMemo(() => {
    return [...leaderboard].sort((a, b) => {
      const av = a[sortCol], bv = b[sortCol];
      return sortDir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    });
  }, [leaderboard, sortCol, sortDir]);

  const toggleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('desc'); }
  };

  const ScoreBadge = ({ score }) => {
    if (score == null) return <span className="badge" style={{ background: 'rgba(148,163,184,0.15)', color: 'var(--muted)' }}>—</span>;
    const c = scoreColor(score);
    return <span className={`badge badge-${c}`}>{score}</span>;
  };

  const OutcomeBadge = ({ outcome }) => {
    const map = { enrolled: 'green', no_show: 'red', cancelled: 'red', rescheduled: 'yellow', pending: 'yellow' };
    const c = map[outcome] || 'yellow';
    return <span className={`badge badge-${c}`}>{(outcome || '').replace(/_/g, ' ')}</span>;
  };

  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 20 }}>Call Center</h1>

      {/* Tabs: Calls vs Leaderboard */}
      <div style={{ display: 'flex', gap: 0, marginBottom: 20, borderBottom: '1px solid var(--border)' }}>
        <div className={'tab' + (activeTab === 'calls' ? ' active' : '')} onClick={() => setActiveTab('calls')}>Call Log</div>
        <div className={'tab' + (activeTab === 'leaderboard' ? ' active' : '')} onClick={() => setActiveTab('leaderboard')}>Rep Leaderboard</div>
      </div>

      {activeTab === 'leaderboard' ? (
        <div className="card">
          <table>
            <thead>
              <tr>
                <th>Rep</th>
                {[['avg_score','Avg Score'],['close_rate','Close Rate %'],['enrolled_count','Enrolled'],['avg_talk_ratio','Avg Talk Ratio'],['total_calls','Total Calls']].map(([col,label]) => (
                  <th key={col} onClick={() => toggleSort(col)} style={{ cursor: 'pointer' }}>
                    {label} {sortCol === col && (sortDir === 'asc' ? '↑' : '↓')}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sortedLeaderboard.map(rep => (
                <tr key={rep.closer}>
                  <td style={{ fontWeight: 600 }}>{rep.closer}</td>
                  <td><ScoreBadge score={Math.round(rep.avg_score)} /></td>
                  <td>{fmt.pctInt(rep.close_rate)}</td>
                  <td>{rep.enrolled_count}</td>
                  <td>{Math.round(rep.avg_talk_ratio)}%</td>
                  <td>{rep.total_calls}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ) : (
        <>
          {/* Filters */}
          <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
            <input type="date" placeholder="Start" value={filters.start_date} onChange={e => setFilters({...filters, start_date: e.target.value})} style={{ width: 150 }} />
            <input type="date" placeholder="End" value={filters.end_date} onChange={e => setFilters({...filters, end_date: e.target.value})} style={{ width: 150 }} />
            <input placeholder="Closer" value={filters.closer} onChange={e => setFilters({...filters, closer: e.target.value})} style={{ width: 140 }} />
            <select value={filters.outcome} onChange={e => setFilters({...filters, outcome: e.target.value})} style={{ width: 150 }}>
              <option value="">All Outcomes</option>
              <option value="enrolled">Enrolled</option>
              <option value="no_show">No Show</option>
              <option value="cancelled">Cancelled</option>
              <option value="rescheduled">Rescheduled</option>
              <option value="pending">Pending</option>
            </select>
            <div style={{ position: 'relative', width: 200 }}>
              <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: 'var(--muted)' }}>{Icons.search}</span>
              <input placeholder="Search contact..." value={filters.search} onChange={e => setFilters({...filters, search: e.target.value})} style={{ paddingLeft: 32 }} />
            </div>
          </div>

          {/* Split View */}
          <div style={{ display: 'flex', gap: 16, minHeight: 500 }}>
            {/* Left: Call List */}
            <div style={{ width: selectedCall ? '40%' : '100%', transition: 'width 0.3s' }}>
              <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
                {loading ? <div style={{ padding: 20, color: 'var(--muted)' }}>Loading...</div> : (
                  <table>
                    <thead>
                      <tr>
                        <th>Contact</th>
                        <th>Closer</th>
                        <th>Date</th>
                        <th>Duration</th>
                        <th>Score</th>
                        <th>Outcome</th>
                      </tr>
                    </thead>
                    <tbody>
                      {calls.map(call => (
                        <tr key={call.call_id} onClick={() => selectCall(call)} style={{ cursor: 'pointer', background: selectedCall?.call_id === call.call_id ? 'rgba(0,214,143,0.06)' : 'transparent' }}>
                          <td style={{ fontWeight: 500 }}>{call.contact_name}</td>
                          <td style={{ color: 'var(--muted)' }}>{call.closer}</td>
                          <td style={{ color: 'var(--muted)', fontSize: 13 }}>{fmt.date(call.call_date)}</td>
                          <td style={{ color: 'var(--muted)', fontSize: 13 }}>{fmt.mmss(call.duration_seconds)}</td>
                          <td><ScoreBadge score={call.overall_score} /></td>
                          <td><OutcomeBadge outcome={call.outcome} /></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
                {/* Pagination */}
                {total > 50 && (
                  <div style={{ display: 'flex', justifyContent: 'center', gap: 12, padding: 12 }}>
                    <button className="btn btn-outline" disabled={page <= 1} onClick={() => setPage(p => p-1)}>Prev</button>
                    <span style={{ color: 'var(--muted)', fontSize: 13, alignSelf: 'center' }}>Page {page} of {Math.ceil(total/50)}</span>
                    <button className="btn btn-outline" disabled={page * 50 >= total} onClick={() => setPage(p => p+1)}>Next</button>
                  </div>
                )}
              </div>
            </div>

            {/* Right: Call Detail */}
            {selectedCall && callDetail && (
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="card" style={{ marginBottom: 16 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
                    <div>
                      <h3 style={{ fontSize: 18, fontWeight: 700 }}>{callDetail.contact_name}</h3>
                      <div style={{ fontSize: 13, color: 'var(--muted)' }}>{callDetail.closer} · {fmt.date(callDetail.call_date)} · {fmt.mmss(callDetail.duration_seconds)}</div>
                    </div>
                    <button className="btn btn-outline" onClick={() => { setSelectedCall(null); setCallDetail(null); }} style={{ fontSize: 12, padding: '4px 12px' }}>✕ Close</button>
                  </div>

                  {callDetail.scores && (
                    <>
                      {/* Score cards */}
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 12, marginBottom: 16 }}>
                        <div style={{ textAlign: 'center' }}>
                          <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>OVERALL</div>
                          <div style={{ fontSize: 36, fontWeight: 800, color: `var(--${scoreColor(callDetail.scores.overall_score)})` }}>{callDetail.scores.overall_score}</div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                          <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>TALK RATIO</div>
                          <div style={{ fontSize: 20, fontWeight: 700, color: callDetail.scores.talk_ratio <= 60 ? 'var(--green)' : 'var(--red)' }}>{callDetail.scores.talk_ratio}%</div>
                          <div className="progress-bar" style={{ marginTop: 4 }}>
                            <div className="progress-fill" style={{ width: callDetail.scores.talk_ratio + '%', background: callDetail.scores.talk_ratio <= 60 ? 'var(--green)' : 'var(--red)' }} />
                          </div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                          <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>ENERGY</div>
                          <div style={{ fontSize: 20, fontWeight: 700 }}>{callDetail.scores.energy}<span style={{ fontSize: 13, color: 'var(--muted)' }}>/10</span></div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                          <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>OBJECTIONS</div>
                          <div style={{ fontSize: 20, fontWeight: 700 }}>{callDetail.scores.objection_handling}<span style={{ fontSize: 13, color: 'var(--muted)' }}>/10</span></div>
                        </div>
                        <div style={{ textAlign: 'center' }}>
                          <div style={{ fontSize: 11, color: 'var(--muted)', marginBottom: 4 }}>NEXT STEPS</div>
                          <div style={{ fontSize: 24, fontWeight: 700 }}>{callDetail.scores.next_steps ? '✓' : '✗'}</div>
                        </div>
                      </div>

                      {/* Coach Notes */}
                      {callDetail.scores.coach_notes && (
                        <div className="callout" style={{ marginBottom: 16 }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                            {Icons.lightbulb}
                            <span style={{ fontWeight: 600, fontSize: 13 }}>AI Coach Notes</span>
                          </div>
                          <div style={{ fontSize: 13, lineHeight: 1.6, color: 'var(--muted)' }}>{callDetail.scores.coach_notes}</div>
                        </div>
                      )}
                    </>
                  )}

                  {/* Audio Player */}
                  {audioUrl && (
                    <div style={{ marginBottom: 16 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Recording</div>
                      <audio controls src={audioUrl} style={{ width: '100%' }} />
                    </div>
                  )}

                  {/* Transcript */}
                  {callDetail.transcript && (
                    <div style={{ marginBottom: 16 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 6 }}>Transcript</div>
                      <div style={{ background: 'var(--bg)', border: '1px solid var(--border)', borderRadius: 8, padding: 14, maxHeight: 300, overflowY: 'auto', fontFamily: 'monospace', fontSize: 12, lineHeight: 1.7, whiteSpace: 'pre-wrap', color: 'var(--muted)' }}>
                        {callDetail.transcript}
                      </div>
                    </div>
                  )}

                  {/* Manager Override */}
                  <div>
                    <div onClick={() => setShowOverride(!showOverride)} style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 600, color: 'var(--muted)', marginBottom: showOverride ? 12 : 0 }}>
                      <span style={{ transform: showOverride ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s' }}>{Icons.chevron}</span>
                      Manager Override
                    </div>
                    {showOverride && (
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                        <div>
                          <label style={{ fontSize: 12, color: 'var(--muted)', display: 'block', marginBottom: 4 }}>Override Score</label>
                          <input type="number" min="0" max="100" value={overrideScore} onChange={e => setOverrideScore(e.target.value)} placeholder="0-100" style={{ width: 120 }} />
                        </div>
                        <div>
                          <label style={{ fontSize: 12, color: 'var(--muted)', display: 'block', marginBottom: 4 }}>Coaching Notes</label>
                          <textarea value={overrideNotes} onChange={e => setOverrideNotes(e.target.value)} rows={3} placeholder="Manager coaching notes..." />
                        </div>
                        <button className="btn btn-primary" onClick={saveOverride} style={{ alignSelf: 'flex-start' }}>Save Override</button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════
   PIPELINE MODULE
   ═══════════════════════════════════════════════ */
function PipelineModule({ clientId, locationId }) {
  const [pipeline, setPipeline] = useState(null);
  const [opportunities, setOpportunities] = useState([]);
  const [oppTotal, setOppTotal] = useState(0);
  const [oppPage, setOppPage] = useState(1);
  const [filters, setFilters] = useState({ stage: '', status: '', start_date: '', end_date: '' });
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (!clientId || !locationId) return;
    setLoading(true);
    API('/pipeline?' + new URLSearchParams({ client_id: clientId, location_id: locationId }))
      .then(d => { setPipeline(d); setLoading(false); })
      .catch(() => setLoading(false));
  }, [clientId, locationId]);

  useEffect(() => {
    if (!clientId || !locationId) return;
    const params = new URLSearchParams({ client_id: clientId, location_id: locationId, page: String(oppPage), page_size: '50' });
    Object.entries(filters).forEach(([k, v]) => { if (v) params.set(k, v); });
    API('/pipeline/opportunities?' + params)
      .then(d => { setOpportunities(d.opportunities || []); setOppTotal(d.total || 0); })
      .catch(() => {});
  }, [clientId, locationId, oppPage, filters]);

  if (loading) return <div style={{ padding: 40, color: 'var(--muted)' }}>Loading pipeline...</div>;

  const maxCount = pipeline ? Math.max(...pipeline.stages.map(s => s.count), 1) : 1;
  const stageColors = ['#00d68f', '#00b377', '#0891b2', '#6366f1', '#a855f7', '#ec4899', '#f59e0b', '#ef4444'];

  return (
    <div>
      <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 20 }}>Pipeline</h1>

      {pipeline && (
        <>
          {/* Summary */}
          <div style={{ display: 'flex', gap: 16, marginBottom: 24 }}>
            <div className="card" style={{ flex: 1, textAlign: 'center' }}>
              <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4, fontWeight: 600, textTransform: 'uppercase' }}>Total Opportunities</div>
              <div style={{ fontSize: 28, fontWeight: 700 }}>{pipeline.total_opportunities}</div>
            </div>
            <div className="card" style={{ flex: 1, textAlign: 'center' }}>
              <div style={{ fontSize: 12, color: 'var(--muted)', marginBottom: 4, fontWeight: 600, textTransform: 'uppercase' }}>Total Value</div>
              <div style={{ fontSize: 28, fontWeight: 700 }}>{fmt.usd(pipeline.total_value)}</div>
            </div>
          </div>

          {/* Horizontal bar chart */}
          <div className="card" style={{ marginBottom: 24 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 16 }}>Funnel by Stage</div>
            {pipeline.stages.map((s, i) => (
              <div key={s.stage} style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10 }}>
                <div style={{ width: 120, fontSize: 13, fontWeight: 500, textAlign: 'right', flexShrink: 0 }}>{s.stage}</div>
                <div style={{ flex: 1, height: 28, background: 'rgba(255,255,255,0.05)', borderRadius: 6, overflow: 'hidden', position: 'relative' }}>
                  <div style={{ height: '100%', width: (s.count / maxCount * 100) + '%', background: stageColors[i % stageColors.length], borderRadius: 6, transition: 'width 0.5s', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', paddingRight: 8, fontSize: 12, fontWeight: 600, minWidth: 30 }}>
                    {s.count}
                  </div>
                </div>
                <div style={{ width: 80, fontSize: 12, color: 'var(--muted)', textAlign: 'right' }}>{fmt.usd(s.total_value)}</div>
              </div>
            ))}
          </div>

          {/* Stage breakdown table */}
          <div className="card" style={{ marginBottom: 24 }}>
            <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Stage Breakdown</div>
            <table>
              <thead>
                <tr>
                  <th>Stage</th>
                  <th>Count</th>
                  <th>Total Value</th>
                  <th>Avg Days in Stage</th>
                </tr>
              </thead>
              <tbody>
                {pipeline.stages.map(s => (
                  <tr key={s.stage}>
                    <td style={{ fontWeight: 500 }}>{s.stage}</td>
                    <td>{s.count}</td>
                    <td>{fmt.usd(s.total_value)}</td>
                    <td>{s.avg_days_in_stage} days</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      )}

      {/* Filters */}
      <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
        <select value={filters.stage} onChange={e => setFilters({...filters, stage: e.target.value})} style={{ width: 180 }}>
          <option value="">All Stages</option>
          {pipeline?.stages.map(s => <option key={s.stage} value={s.stage}>{s.stage}</option>)}
        </select>
        <select value={filters.status} onChange={e => setFilters({...filters, status: e.target.value})} style={{ width: 140 }}>
          <option value="">All Statuses</option>
          <option value="open">Open</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>
        <input type="date" value={filters.start_date} onChange={e => setFilters({...filters, start_date: e.target.value})} style={{ width: 150 }} />
        <input type="date" value={filters.end_date} onChange={e => setFilters({...filters, end_date: e.target.value})} style={{ width: 150 }} />
      </div>

      {/* Opportunities table */}
      <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
        <table>
          <thead>
            <tr>
              <th>Contact</th>
              <th>Stage</th>
              <th>Status</th>
              <th>Value</th>
              <th>Created</th>
              <th>Days in Stage</th>
            </tr>
          </thead>
          <tbody>
            {opportunities.map(opp => (
              <tr key={opp.opportunity_id}>
                <td style={{ fontWeight: 500 }}>{opp.contact_name}</td>
                <td>{opp.stage}</td>
                <td>
                  <span className={`badge badge-${opp.status === 'won' ? 'green' : opp.status === 'lost' ? 'red' : 'yellow'}`}>
                    {opp.status}
                  </span>
                </td>
                <td>{fmt.usd(opp.value)}</td>
                <td style={{ color: 'var(--muted)', fontSize: 13 }}>{fmt.date(opp.created_at)}</td>
                <td>{opp.days_in_stage} days</td>
              </tr>
            ))}
          </tbody>
        </table>
        {oppTotal > 50 && (
          <div style={{ display: 'flex', justifyContent: 'center', gap: 12, padding: 12 }}>
            <button className="btn btn-outline" disabled={oppPage <= 1} onClick={() => setOppPage(p => p-1)}>Prev</button>
            <span style={{ color: 'var(--muted)', fontSize: 13, alignSelf: 'center' }}>Page {oppPage} of {Math.ceil(oppTotal/50)}</span>
            <button className="btn btn-outline" disabled={oppPage * 50 >= oppTotal} onClick={() => setOppPage(p => p+1)}>Next</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   ADD CLIENT MODULE
   ═══════════════════════════════════════════════ */
function AddClientModule({ onClientAdded }) {
  const [form, setForm] = useState({
    client_name: '',
    multi_location: false,
    industry: '',
    survival_threshold: 150,
    target_mrr: 30000,
    locations: [{ location_name: '', ghl_location_id: '', ghl_api_token: '', meta_account_id: '', meta_access_token: '', sales_start_date: '', opening_date: '' }],
  });
  const [saving, setSaving] = useState(false);
  const [message, setMessage] = useState('');

  const updateField = (field, value) => setForm(f => ({ ...f, [field]: value }));
  const updateLocation = (idx, field, value) => {
    const locs = [...form.locations];
    locs[idx] = { ...locs[idx], [field]: value };
    setForm(f => ({ ...f, locations: locs }));
  };
  const addLocation = () => setForm(f => ({ ...f, locations: [...f.locations, { location_name: '', ghl_location_id: '', ghl_api_token: '', meta_account_id: '', meta_access_token: '', sales_start_date: '', opening_date: '' }] }));
  const removeLocation = (idx) => setForm(f => ({ ...f, locations: f.locations.filter((_, i) => i !== idx) }));

  const handleSubmit = async () => {
    if (!form.client_name) return setMessage('Client name is required.');
    if (!form.locations.length || !form.locations[0].location_name) return setMessage('At least one location is required.');
    setSaving(true);
    setMessage('');
    try {
      const resp = await API('/clients', { method: 'POST', body: JSON.stringify(form) });
      if (resp.client_id) {
        setMessage('Client created successfully!');
        setForm({ client_name: '', multi_location: false, industry: '', survival_threshold: 150, target_mrr: 30000, locations: [{ location_name: '', ghl_location_id: '', ghl_api_token: '', meta_account_id: '', meta_access_token: '', sales_start_date: '', opening_date: '' }] });
        if (onClientAdded) onClientAdded();
      } else {
        setMessage('Error creating client.');
      }
    } catch { setMessage('Error creating client.'); }
    setSaving(false);
  };

  const Field = ({ label, value, onChange, type = 'text', ...props }) => (
    <div style={{ marginBottom: 14 }}>
      <label style={{ display: 'block', fontSize: 12, color: 'var(--muted)', marginBottom: 4, fontWeight: 600 }}>{label}</label>
      <input type={type} value={value} onChange={e => onChange(type === 'number' ? Number(e.target.value) : e.target.value)} {...props} />
    </div>
  );

  return (
    <div style={{ maxWidth: 700 }}>
      <h1 style={{ fontSize: 24, fontWeight: 700, marginBottom: 20 }}>Add Client</h1>

      <div className="card" style={{ marginBottom: 20 }}>
        <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 16 }}>Client Information</div>
        <Field label="Client Name" value={form.client_name} onChange={v => updateField('client_name', v)} />
        <div style={{ marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10 }}>
          <label style={{ fontSize: 12, color: 'var(--muted)', fontWeight: 600 }}>Multi-Location</label>
          <div onClick={() => updateField('multi_location', !form.multi_location)} style={{ width: 40, height: 22, borderRadius: 11, background: form.multi_location ? 'var(--accent)' : 'var(--border)', cursor: 'pointer', position: 'relative', transition: 'background 0.2s' }}>
            <div style={{ width: 16, height: 16, borderRadius: '50%', background: '#fff', position: 'absolute', top: 3, left: form.multi_location ? 21 : 3, transition: 'left 0.2s' }} />
          </div>
        </div>
        <Field label="Industry" value={form.industry} onChange={v => updateField('industry', v)} />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
          <Field label="Survival Threshold (Members)" type="number" value={form.survival_threshold} onChange={v => updateField('survival_threshold', v)} />
          <Field label="Target MRR ($)" type="number" value={form.target_mrr} onChange={v => updateField('target_mrr', v)} />
        </div>
      </div>

      {/* Locations */}
      {form.locations.map((loc, idx) => (
        <div className="card" key={idx} style={{ marginBottom: 16 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
            <div style={{ fontSize: 14, fontWeight: 600 }}>Location {idx + 1}</div>
            {form.locations.length > 1 && (
              <button className="btn btn-outline" onClick={() => removeLocation(idx)} style={{ fontSize: 12, padding: '4px 10px', color: 'var(--red)' }}>Remove</button>
            )}
          </div>
          <Field label="Location Name" value={loc.location_name} onChange={v => updateLocation(idx, 'location_name', v)} />
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Field label="GHL Location ID" value={loc.ghl_location_id} onChange={v => updateLocation(idx, 'ghl_location_id', v)} />
            <Field label="GHL API Token" value={loc.ghl_api_token} onChange={v => updateLocation(idx, 'ghl_api_token', v)} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Field label="Meta Account ID" value={loc.meta_account_id} onChange={v => updateLocation(idx, 'meta_account_id', v)} />
            <Field label="Meta Access Token" value={loc.meta_access_token} onChange={v => updateLocation(idx, 'meta_access_token', v)} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Field label="Sales Start Date" type="date" value={loc.sales_start_date} onChange={v => updateLocation(idx, 'sales_start_date', v)} />
            <Field label="Opening Date" type="date" value={loc.opening_date} onChange={v => updateLocation(idx, 'opening_date', v)} />
          </div>
        </div>
      ))}

      {form.multi_location && (
        <button className="btn btn-outline" onClick={addLocation} style={{ marginBottom: 20 }}>+ Add Location</button>
      )}

      {message && (
        <div style={{ marginBottom: 16, padding: '10px 14px', borderRadius: 8, background: message.includes('success') ? 'rgba(0,214,143,0.1)' : 'rgba(239,68,68,0.1)', color: message.includes('success') ? 'var(--green)' : 'var(--red)', fontSize: 13 }}>
          {message}
        </div>
      )}

      <button className="btn btn-primary" onClick={handleSubmit} disabled={saving} style={{ fontSize: 15, padding: '10px 32px' }}>
        {saving ? 'Saving...' : 'Create Client'}
      </button>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   MAIN APP
   ═══════════════════════════════════════════════ */
function App() {
  const [clients, setClients] = useState([]);
  const [selectedClient, setSelectedClient] = useState(null);
  const [selectedLocation, setSelectedLocation] = useState(null);
  const [activePage, setActivePage] = useState('scorecard');
  const [loadingClients, setLoadingClients] = useState(true);

  const fetchClients = useCallback(() => {
    API('/clients').then(d => {
      const list = d.clients || [];
      setClients(list);
      if (list.length && !selectedClient) {
        setSelectedClient(list[0]);
        setSelectedLocation(list[0].locations?.[0] || null);
      }
      setLoadingClients(false);
    }).catch(() => setLoadingClients(false));
  }, []);

  useEffect(() => { fetchClients(); }, [fetchClients]);

  const handleLogout = () => {
    if (confirm('Log out?')) window.location.reload();
  };

  const renderPage = () => {
    const cid = selectedClient?.client_id;
    const lid = selectedLocation?.location_id;
    const locs = selectedClient?.locations || [];

    switch (activePage) {
      case 'scorecard':
        return <ScorecardModule clientId={cid} locationId={lid} />;
      case 'analytics':
        return <AnalyticsModule clientId={cid} locationId={lid} locations={locs} />;
      case 'callcenter':
        return <CallCenterModule clientId={cid} locationId={lid} />;
      case 'pipeline':
        return <PipelineModule clientId={cid} locationId={lid} />;
      case 'addclient':
        return <AddClientModule onClientAdded={fetchClients} />;
      default:
        return <ScorecardModule clientId={cid} locationId={lid} />;
    }
  };

  if (loadingClients) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', color: 'var(--muted)' }}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ width: 48, height: 48, borderRadius: 12, background: 'linear-gradient(135deg, var(--accent), #00b377)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 800, fontSize: 24, color: '#000', margin: '0 auto 16px' }}>R</div>
          <div>Loading Revryze OS...</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex' }}>
      <Sidebar
        clients={clients}
        selectedClient={selectedClient}
        selectedLocation={selectedLocation}
        onSelectClient={setSelectedClient}
        onSelectLocation={setSelectedLocation}
        activePage={activePage}
        onNavigate={setActivePage}
        onLogout={handleLogout}
      />
      <main style={{ marginLeft: 240, flex: 1, padding: '28px 32px', minHeight: '100vh' }}>
        {!selectedClient && activePage !== 'addclient' ? (
          <div style={{ textAlign: 'center', padding: '60px 20px', color: 'var(--muted)' }}>
            <div style={{ fontSize: 20, marginBottom: 12 }}>No clients yet</div>
            <div style={{ marginBottom: 20, fontSize: 14 }}>Add your first client to get started.</div>
            <button className="btn btn-primary" onClick={() => setActivePage('addclient')}>Add Client</button>
          </div>
        ) : renderPage()}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
